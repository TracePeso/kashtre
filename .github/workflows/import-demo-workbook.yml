name: Import Demo Workbook on Demo Server

on:
  workflow_dispatch:

concurrency:
  group: import-demo-workbook
  cancel-in-progress: false

jobs:
  import:
    name: Import three demonstration organisations
    runs-on: ubuntu-latest
    steps:
      - name: Run workbook import on demo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.STAGING_VPS_HOST }}
          username: ${{ vars.STAGING_VPS_USER }}
          key: ${{ secrets.STAGING_VPS_SSH_KEY || secrets.VPS_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -e
            DEPLOY_PATH="${{ vars.DEMO_DEPLOY_PATH || '/var/www/demo' }}"
            ARTISAN_PHP="php -d opcache.enable_cli=0 -d memory_limit=1024M"
            cd "$DEPLOY_PATH"
            test -f "data/Kashtre Import Data.xlsx"
            $ARTISAN_PHP artisan kashtre:import-demo-workbook
