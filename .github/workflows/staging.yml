name: Deploy Staging Branch to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - staging

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Staging Branch
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.STAGING_VPS_HOST }}
          username: ${{ vars.STAGING_VPS_USER }}
          key: ${{ secrets.STAGING_VPS_SSH_KEY || secrets.VPS_SSH_KEY }}
          script: |
            set -e

            DEPLOY_PATH="${{ vars.STAGING_DEPLOY_PATH }}"
            PHP_FPM_SERVICE="${{ vars.STAGING_PHP_FPM_SERVICE || 'php8.3-fpm' }}"
            ARTISAN_PHP="php -d opcache.enable_cli=0"
            WEB_USER="${{ vars.STAGING_WEB_USER || 'www-data' }}"
            WEB_GROUP="${{ vars.STAGING_WEB_GROUP || 'www-data' }}"

            if [ -z "$DEPLOY_PATH" ]; then
              echo "STAGING_DEPLOY_PATH is not configured."
              exit 1
            fi

            echo "Starting STAGING deployment..."

            git config --global --add safe.directory "$DEPLOY_PATH"

            cd "$DEPLOY_PATH"

            echo "Fetching latest code..."
            git fetch origin

            echo "Resetting to staging branch..."
            git reset --hard origin/staging

            echo "Installing PHP dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "Installing Node dependencies..."
            npm install --no-audit --no-fund

            echo "Building frontend..."
            export VITE_REVERB_APP_KEY="kashtre-reverb-key"
            export VITE_REVERB_HOST="reverb.kashtre.com"
            export VITE_REVERB_PORT="443"
            export VITE_REVERB_SCHEME="https"
            export VITE_WEBRTC_STUN_URLS="${{ vars.VITE_WEBRTC_STUN_URLS || 'stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302' }}"
            export VITE_WEBRTC_TURN_URL="${{ secrets.VITE_WEBRTC_TURN_URL }}"
            export VITE_WEBRTC_TURN_USERNAME="${{ secrets.VITE_WEBRTC_TURN_USERNAME }}"
            export VITE_WEBRTC_TURN_CREDENTIAL="${{ secrets.VITE_WEBRTC_TURN_CREDENTIAL }}"
            export VITE_WEBRTC_ICE_TRANSPORT_POLICY="${{ vars.VITE_WEBRTC_ICE_TRANSPORT_POLICY || 'all' }}"
            npm run build

            fix_runtime_permissions() {
              mkdir -p storage/framework/views storage/framework/cache storage/framework/sessions bootstrap/cache
              chown -R "$WEB_USER:$WEB_GROUP" storage bootstrap/cache
              find storage bootstrap/cache -type d -exec chmod 775 {} \;
              find storage bootstrap/cache -type f -exec chmod 664 {} \;
            }

            echo "Fixing permissions..."
            chown -R "$WEB_USER:$WEB_GROUP" "$DEPLOY_PATH"
            fix_runtime_permissions

            echo "Clearing stale cache files..."
            rm -f bootstrap/cache/*.php
            rm -f storage/framework/views/*.php

            echo "Removing unexpected PHP files from public asset and upload paths..."
            find public/vendor/livewire -type f \( -name "*.php" -o -name "*.phtml" -o -name "*.phar" \) -delete 2>/dev/null || true
            find public/vendor/livewire -depth -type d -empty -delete 2>/dev/null || true
            find storage/app/public -type f \( -name "*.php" -o -name "*.phtml" -o -name "*.phar" \) -delete 2>/dev/null || true
            find storage/app/public -depth -type d -empty -delete 2>/dev/null || true

            echo "Creating storage link..."
            $ARTISAN_PHP artisan storage:link || true

            echo "Checking for existing tables that need migration records..."
            $ARTISAN_PHP artisan fix:existing-tables

            echo "Running migrations..."
            $ARTISAN_PHP artisan migrate --force --verbose

            echo "Bootstrapping missing HR routing structures..."
            $ARTISAN_PHP artisan hr:build-routing-structure --auto-discover --if-missing --upgrade-generated --no-interaction

            echo "Checking migration status..."
            $ARTISAN_PHP artisan migrate:status

            echo "Clearing caches..."
            $ARTISAN_PHP artisan optimize:clear

            echo "Caching config/routes/views..."
            $ARTISAN_PHP artisan config:cache
            $ARTISAN_PHP artisan route:cache
            $ARTISAN_PHP artisan view:cache

            echo "Restoring runtime ownership after cache generation..."
            fix_runtime_permissions

            echo "Restarting queues..."
            $ARTISAN_PHP artisan queue:restart || true

            echo "Restarting PHP-FPM..."
            systemctl restart "$PHP_FPM_SERVICE"

            echo "Staging deployment completed successfully."
