name: Isolated replacement Clinical UI bridge
on:
  push:
    branches: [work/clinical-replacement-ui-bridge]
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install locked test dependencies without application scripts
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --ignore-platform-req=ext-gd --ignore-platform-req=ext-zip
      - name: Lint bridge
        run: |
          php -l app/Http/Controllers/ClinicalReplacementController.php
          php -l routes/clinical_replacement.php
          php -l tests/Unit/ClinicalReplacementBridgeTest.php
      - name: Test bridge in memory without database or application boot
        run: vendor/bin/phpunit --no-configuration --bootstrap vendor/autoload.php tests/Unit/ClinicalReplacementBridgeTest.php
