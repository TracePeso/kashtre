name: Deploy App (Production)

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS (root)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.124.117.169
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "🚀 Starting PRODUCTION deployment..."

            # Trust repo for root (fixes 'dubious ownership')
            git config --global --add safe.directory /var/www/my-app

            cd /var/www/my-app

            echo "📥 Fetching latest code..."
            git fetch origin

            echo "🔀 Resetting to main branch..."
            git reset --hard origin/main

            echo "📦 Installing PHP dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "📦 Installing Node dependencies..."
            npm ci

            echo "🏗 Building frontend..."
            npm run build

            echo "🔧 Fixing permissions..."
            chown -R www-data:www-data /var/www/my-app
            chmod -R 775 storage bootstrap/cache

            echo "🔗 Creating storage link..."
            php artisan storage:link || true

            echo "🗄 Running migrations..."
            php artisan migrate --force

            echo "🧹 Clearing caches..."
            php artisan optimize:clear

            echo "⚡ Caching config/routes/views..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "🔄 Restarting queues (if any)..."
            php artisan queue:restart || true

            echo "♻️ Restarting PHP-FPM..."
            systemctl restart php8.3-fpm

            echo "✅ Production deployment completed successfully!"